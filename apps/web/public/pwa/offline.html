<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#fff" />
        <title>SAPO — Offline</title>
        <script>
            try {
                document.documentElement.dataset.siteTheme =
                    localStorage.getItem("sapo:site-theme") || "system";
            } catch {}
        </script>
        <style>
            :root {
                color-scheme: light dark;
                background: light-dark(#fff, #101010);
            }
            :root[data-site-theme="light"] {
                color-scheme: light;
            }
            :root[data-site-theme="dark"] {
                color-scheme: dark;
            }
            body {
                font: 18px system-ui;
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-content: center;
                text-align: center;
                padding: 24px;
                background: light-dark(#fff, #101010);
                color: light-dark(#202320, #e8e8e8);
            }
            img {
                width: 96px;
                margin: auto;
            }
            h1 {
                letter-spacing: 0.25em;
                font-size: 22px;
            }
            p {
                max-width: 320px;
                line-height: 1.6;
                color: light-dark(#666, #adadad);
            }
            a {
                color: inherit;
                text-underline-offset: 5px;
            }
        </style>
        <script>
            const media = matchMedia("(prefers-color-scheme: dark)");
            const syncThemeColor = () => {
                const theme = document.documentElement.dataset.siteTheme;
                const dark = theme === "dark" || (theme !== "light" && media.matches);
                document
                    .querySelector('meta[name="theme-color"]')
                    .setAttribute("content", dark ? "#101010" : "#ffffff");
            };
            media.addEventListener("change", syncThemeColor);
            syncThemeColor();
        </script>
    </head>
    <body>
        <img src="/pwa/icons/app-192.png" alt="SAPO frog" />
        <h1>S A P O</h1>
        <p>You’re offline. Connect to the internet to translate and respell.</p>
        <a href="/pwa/">Try again</a>
    </body>
</html>
